<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dennis ♥ Un Universo Para Ti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030008;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }

        .glass-panel {
            background: rgba(22, 10, 32, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 182, 193, 0.25);
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.22);
        }

        .glow-text {
            text-shadow: 0 0 12px rgba(255, 182, 193, 0.9), 0 0 24px rgba(255, 105, 180, 0.7);
        }

        .planet-label {
            position: absolute;
            z-index: 10;
            transform: translate(-50%, -50%);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
            background: rgba(35, 14, 50, 0.88);
            border: 1px solid rgba(255, 192, 203, 0.5);
            box-shadow: 0 0 14px rgba(255, 105, 180, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 36px;
        }

        .planet-label:active {
            transform: translate(-50%, -50%) scale(1.15);
            background: rgba(255, 70, 160, 0.95);
            border-color: #ffffff;
            box-shadow: 0 0 22px rgba(255, 182, 193, 0.9);
        }

        .planet-label::before {
            content: '♥';
            font-size: 11px;
            color: #ff69b4;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .word-chip {
            min-height: 44px;
            padding: 0 16px;
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 182, 193, 0.3);
            color: #ffe4e6;
            transition: all 0.2s ease;
        }

        .word-chip:active, .word-chip.active {
            background: linear-gradient(135deg, #ff4081, #e91e63);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 18px rgba(255, 64, 129, 0.7);
            transform: scale(0.96);
        }

        @keyframes heartbeatPulse {
            0% { transform: scale(1); }
            14% { transform: scale(1.12); }
            28% { transform: scale(1); }
            42% { transform: scale(1.18); }
            70% { transform: scale(1); }
        }

        .animate-heartbeat {
            animation: heartbeatPulse 1.8s infinite ease-in-out;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .animate-float {
            animation: floatSlow 4s infinite ease-in-out;
        }

        @keyframes mobileSlideUp {
            from { opacity: 0; transform: translate(-50%, 40px) scale(0.96); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        .animate-bottom-sheet {
            animation: mobileSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .bg-heart-particle {
            position: absolute;
            color: rgba(255, 105, 180, 0.35);
            pointer-events: none;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="safe-area-inset">

    <div id="start-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gradient-to-b from-[#0a0212] via-[#160624] to-[#030008] transition-opacity duration-700">
        <div id="start-particles" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

        <div class="glass-panel p-6 rounded-3xl border-2 border-pink-400/50 shadow-2xl text-center max-w-sm w-full relative z-10 animate-float flex flex-col items-center">
            
            <div class="relative mb-3 flex items-center justify-center">
                <div class="absolute inset-0 rounded-2xl bg-pink-500/30 blur-xl animate-pulse"></div>
                <div class="w-20 h-20 rounded-2xl bg-zinc-900 border-2 border-pink-300/60 p-1 shadow-2xl relative z-10 overflow-hidden flex items-center justify-center">
                    <div class="w-12 h-12 rounded-full bg-pink-600/90 text-white flex items-center justify-center text-xl shadow-md animate-heartbeat">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>
            </div>

            <p class="text-pink-300 text-[11px] font-semibold tracking-widest uppercase mb-1">Un regalo para ti</p>
            <h1 class="text-5xl font-cursive text-pink-100 glow-text mb-2">Dennis</h1>
            

            <p class="text-pink-200/90 text-xs leading-relaxed mb-4 font-light">
            </p>

            <button id="start-btn" class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-pink-500 via-rose-500 to-pink-600 text-white font-bold text-sm shadow-lg shadow-pink-500/40 active:scale-95 transition-all flex items-center justify-center gap-2.5 border border-pink-300/40 mb-3">
                <i class="fa-solid fa-play text-xs"></i>
                <span>Toca para abrir mi universo</span>
            </button>

       
            <div class="w-full pt-2 border-t border-pink-500/20 text-center">
                
                </label>
                <input type="file" id="audio-file-input" accept="audio/*" class="hidden">
            </div>
        </div>
    </div>

    <div id="webgl-container"></div>

    <header id="main-header" class="fixed top-3 inset-x-0 z-20 px-4 pointer-events-none flex justify-center opacity-0 transition-opacity duration-700">
        <div class="glass-panel py-2.5 px-5 rounded-full border border-pink-500/30 flex items-center justify-between gap-3 max-w-sm w-full pointer-events-auto">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-heart text-pink-500 text-lg animate-pulse"></i>
                <span class="text-xl font-cursive text-pink-200 glow-text tracking-wide">Para ti</span>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="music-btn" title="Música">
               
                </button>
                <button id="reset-cam-btn" class="w-10 h-10 rounded-full bg-pink-500/20 active:bg-pink-500/40 border border-pink-400/40 text-pink-200 flex items-center justify-center transition-transform active:scale-90" title="Centrar Vista">
                    <i class="fa-solid fa-compress text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <div id="floating-controls" class="fixed right-3 bottom-28 z-20 flex flex-col gap-3 opacity-0 transition-opacity duration-700">
        <button id="add-word-btn" title="Añadir Palabra">
            <i class="fa-solid fa-plus text-base"></i>
        </button>
    </div>

    <div id="bottom-carousel" class="fixed bottom-3 inset-x-0 z-20 px-3 pointer-events-auto opacity-0 transition-opacity duration-700">
        <div class="glass-panel p-2.5 rounded-3xl border border-pink-500/30 max-w-md mx-auto">
            <div class="text-[10px] uppercase tracking-widest text-pink-300/80 mb-1.5 px-2 text-center font-semibold">
                ✨ Toca una palabra ✨
            </div>
            <div id="chips-carousel" class="flex gap-2 overflow-x-auto no-scrollbar py-1 px-1"></div>
        </div>
    </div>

    <div id="note-modal" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 hidden w-11/12 max-w-sm pointer-events-auto">
        <div class="glass-panel p-6 rounded-3xl border-2 border-pink-400/60 shadow-2xl text-center relative animate-bottom-sheet">
            <button id="close-modal-btn" class="absolute top-3 right-3 text-pink-300/80 active:text-white w-10 h-10 rounded-full flex items-center justify-center bg-pink-500/10 active:bg-pink-500/30">

            <h3 id="modal-title" class="text-3xl font-cursive text-pink-200 glow-text mb-2">Título</h3>
            
            <p id="modal-body" class="text-pink-100/90 text-sm leading-relaxed font-light py-1 max-h-48 overflow-y-auto"></p>
            
            <div class="mt-5 pt-3 border-t border-pink-500/20 flex justify-center">

    <div id="add-modal" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 hidden w-11/12 max-w-sm pointer-events-auto">
        <div class="glass-panel p-6 rounded-3xl border-2 border-pink-400/60 shadow-2xl text-center relative animate-bottom-sheet">

            <h3 class="text-2.5xl font-cursive text-pink-200 glow-text mb-3">Nuevo Planeta para Dennis</h3>
            
            <div class="space-y-3.5 text-left">
                <div>
                    <label class="block text-[11px] text-pink-200 uppercase tracking-wider mb-1 font-semibold">Palabra o Cualidad</label>
                    <input type="text" id="new-word-input" placeholder="Ej: Sonrisita, Mi Sol..." maxlength="16" class="w-full bg-pink-950/50 border border-pink-400/40 rounded-xl px-3.5 py-2.5 text-white placeholder-pink-300/40 focus:outline-none focus:border-pink-400 text-sm">
                </div>
                <div>
                    <label class="block text-[11px] text-pink-200 uppercase tracking-wider mb-1 font-semibold">Mensaje para Dennis</label>
                    <textarea id="new-note-input" rows="3" placeholder="Escribe un detalle bonito..." class="w-full bg-pink-950/50 border border-pink-400/40 rounded-xl px-3.5 py-2.5 text-white placeholder-pink-300/40 focus:outline-none focus:border-pink-400 text-sm resize-none"></textarea>
                </div>
            </div>
            
            <div class="mt-5">
                <button id="submit-word-btn" class="w-full py-3 rounded-full bg-gradient-to-r from-pink-500 to-rose-600 text-white font-semibold text-sm active:scale-95 shadow-lg shadow-pink-500/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rocket"></i> Crear Órbita

        </div>

    <div id="labels-container" class="absolute inset-0 pointer-events-none z-10"></div>

    <audio id="bg-audio" loop preload="auto">
        <source src="./I_Love_You_So.mp3" type="audio/mpeg">
        <source src="./music/I_Love_You_So.mp3" type="audio/mpeg">
        <source src="./audio/I_Love_You_So.mp3" type="audio/mpeg">
    </audio>

    <script>
        const DENNIS_PLANETS = [
            { word: "Dennis", radius: 9, speed: 0.009, angle: 0, tiltX: 0.08, tiltZ: 0.05, note: "Este universo entero gira alrededor de ti. Gracias por ser la persona más especial ♥", icon: "fa-crown" },
            { word: "Hermosa", radius: 13, speed: 0.0075, angle: 1.2, tiltX: -0.12, tiltZ: 0.08, note: "No hay un solo día en el que tu presencia no llene todo de belleza y calidez ✨", icon: "fa-gem" },
            { word: "Ternura", radius: 17, speed: 0.006, angle: 2.5, tiltX: 0.15, tiltZ: -0.08, note: "Tu dulzura y tu forma de ser hacen que cualquier momento gris se vuelva hermoso 🌸", icon: "fa-feather" },
            { word: "Sonrisa", radius: 21, speed: 0.0048, angle: 3.8, tiltX: -0.05, tiltZ: -0.15, note: "Ver tu sonrisa es mi parte favorita de cualquier día. ¡Nunca dejes de sonreír! 😁♥", icon: "fa-face-smile-beam" },
            { word: "Magia", radius: 29, speed: 0.0031, angle: 4.5, tiltX: -0.18, tiltZ: 0.06, note: "Tienes esa magia única de alegrarme el día con una sola palabra ✨", icon: "fa-wand-magic-sparkles" },
            { word: "Alegría", radius: 33, speed: 0.0025, angle: 5.2, tiltX: 0.1, tiltZ: -0.12, note: "Tu energía trae una paz y una felicidad incomparables 🌈", icon: "fa-sun" },
            { word: "Luz", radius: 37, speed: 0.002, angle: 2.1, tiltX: -0.1, tiltZ: 0.18, note: "Eres como un faro de luz constante que ilumina todo a su alrededor 🌟", icon: "fa-lightbulb" },
            { word: "Especial", radius: 41, speed: 0.0016, angle: 3.2, tiltX: 0.14, tiltZ: -0.05, note: "Coincidir contigo en esta vida ha sido la casualidad más linda de todas 🗺️♥", icon: "fa-heart" }
        ];

        let scene, camera, renderer, controls;
        let heartSunGroup, heartMesh, glowingAuraMesh, heartParticles;
        const planetObjects = [];
        const labelsContainer = document.getElementById('labels-container');
        const chipsCarousel = document.getElementById('chips-carousel');
        
        let isAudioPlaying = false;
        const bgAudio = document.getElementById('bg-audio');
        let synthAudioCtx = null;

        function createStartParticles() {
            const container = document.getElementById('start-particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'bg-heart-particle fa-solid fa-heart';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDelay = (Math.random() * 5) + 's';
                p.style.animationDuration = (4 + Math.random() * 5) + 's';
                p.style.fontSize = (12 + Math.random() * 16) + 'px';
                container.appendChild(p);
            }
        }
        createStartParticles();

        function triggerHaptic() {
            if ('vibrate' in navigator) {
                try { navigator.vibrate(12); } catch (e) {}
            }
        }

        function initScene() {
            const container = document.getElementById('webgl-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030008, 0.008);

            const isPortrait = window.innerHeight > window.innerWidth;
            camera = new THREE.PerspectiveCamera(isPortrait ? 68 : 55, window.innerWidth / window.innerHeight, 0.1, 800);
            camera.position.set(0, 32, isPortrait ? 65 : 55);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxDistance = 130;
            controls.minDistance = 10;
            controls.maxPolarAngle = Math.PI / 2 + 0.05;
            controls.rotateSpeed = 0.7;
            controls.zoomSpeed = 0.8;

            const ambientLight = new THREE.AmbientLight(0xffb6c1, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.PointLight(0xff3366, 4.0, 150);
            scene.add(sunLight);

            createHeartSun();
            createCosmicBackground();
            
            DENNIS_PLANETS.forEach(data => addPlanetToScene(data));

            window.addEventListener('resize', onWindowResize);
        }

        function createHeartSun() {
            heartSunGroup = new THREE.Group();

            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            heartShape.moveTo(x + 0.5, y + 0.5);
            heartShape.bezierCurveTo(x + 0.5, y + 0.5, x + 0.4, y, x, y);
            heartShape.bezierCurveTo(x - 0.6, y, x - 0.6, y + 0.7, x - 0.6, y + 0.7);
            heartShape.bezierCurveTo(x - 0.6, y + 1.1, x - 0.3, y + 1.54, x + 0.5, y + 1.9);
            heartShape.bezierCurveTo(x + 1.3, y + 1.54, x + 1.6, y + 1.1, x + 1.6, y + 0.7);
            heartShape.bezierCurveTo(x + 1.6, y + 0.7, x + 1.6, y, x + 1, y);
            heartShape.bezierCurveTo(x + 0.7, y, x + 0.5, y + 0.5, x + 0.5, y + 0.5);

            const extrudeSettings = {
                depth: 0.8,
                bevelEnabled: true,
                bevelSegments: 6,
                steps: 2,
                bevelSize: 0.3,
                bevelThickness: 0.35
            };

            const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            geometry.center();

            const heartMaterial = new THREE.MeshStandardMaterial({
                color: 0xff1493,
                emissive: 0xff0055,
                emissiveIntensity: 1.0,
                roughness: 0.15,
                metalness: 0.25
            });

            heartMesh = new THREE.Mesh(geometry, heartMaterial);
            heartMesh.scale.set(2.7, 2.7, 2.7);
            heartMesh.rotation.z = Math.PI;
            heartSunGroup.add(heartMesh);

            const auraGeo = new THREE.SphereGeometry(3.8, 24, 24);
            const auraMat = new THREE.MeshBasicMaterial({
                color: 0xff69b4,
                transparent: true,
                opacity: 0,
                wireframe: true
            });
            glowingAuraMesh = new THREE.Mesh(auraGeo, auraMat);
            heartSunGroup.add(glowingAuraMesh);

            const particleCount = 200;
            const pGeometry = new THREE.BufferGeometry();
            const pPositions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 4.0 + Math.random() * 3.8;

                pPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                pPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                pPositions[i * 3 + 2] = r * Math.cos(phi);
            }

            pGeometry.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

            const pMaterial = new THREE.PointsMaterial({
                color: 0xffb6c1,
                size: 0.65,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });

            heartParticles = new THREE.Points(pGeometry, pMaterial);
            heartSunGroup.add(heartParticles);

            scene.add(heartSunGroup);
        }

        function createCosmicBackground() {
            const starsCount = 1800;
            const starsGeo = new THREE.BufferGeometry();
            const starsPos = new Float32Array(starsCount * 3);
            const starsColors = new Float32Array(starsCount * 3);

            for (let i = 0; i < starsCount; i++) {
                starsPos[i * 3] = (Math.random() - 0.5) * 380;
                starsPos[i * 3 + 1] = (Math.random() - 0.5) * 380;
                starsPos[i * 3 + 2] = (Math.random() - 0.5) * 380;

                const c = new THREE.Color();
                const rand = Math.random();
                if (rand > 0.6) c.setHSL(0.9, 0.85, 0.85);
                else if (rand > 0.3) c.setHSL(0.12, 0.75, 0.8);
                else c.setHSL(0.6, 0.3, 0.95);

                starsColors[i * 3] = c.r;
                starsColors[i * 3 + 1] = c.g;
                starsColors[i * 3 + 2] = c.b;
            }

            starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
            starsGeo.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));

            const starsMat = new THREE.PointsMaterial({
                size: 1.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });

            const starField = new THREE.Points(starsGeo, starsMat);
            scene.add(starField);
        }

        function addPlanetToScene(data) {
            const orbitGroup = new THREE.Group();
            orbitGroup.rotation.x = data.tiltX;
            orbitGroup.rotation.z = data.tiltZ;
            scene.add(orbitGroup);

            const ringGeo = new THREE.RingGeometry(data.radius - 0.08, data.radius + 0.08, 96);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xff69b4,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.22
            });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.x = Math.PI / 2;
            orbitGroup.add(ringMesh);

            const isDennis = data.word === "Dennis";
            const planetGeo = new THREE.SphereGeometry(isDennis ? 0.95 : 0.75, 24, 24);
            const planetMat = new THREE.MeshStandardMaterial({
                color: isDennis ? 0xff3366 : 0xffb6c1,
                emissive: isDennis ? 0xff0055 : 0xff1493,
                emissiveIntensity: isDennis ? 0.85 : 0.6,
                roughness: 0.1,
                metalness: 0.8
            });
            const planetMesh = new THREE.Mesh(planetGeo, planetMat);

            const pRingGeo = new THREE.RingGeometry(1.05, 1.3, 24);
            const pRingMat = new THREE.MeshBasicMaterial({ color: 0xffc0cb, side: THREE.DoubleSide, transparent: true, opacity: 0.65 });
            const pRing = new THREE.Mesh(pRingGeo, pRingMat);
            pRing.rotation.x = Math.PI / 3;
            planetMesh.add(pRing);

            orbitGroup.add(planetMesh);

            const label = document.createElement('div');
            label.className = 'planet-label';
            if (isDennis) label.classList.add('border-2', 'border-pink-300');
            label.innerHTML = `<span>${data.word}</span>`;
            labelsContainer.appendChild(label);

            const planetObj = {
                data: data,
                mesh: planetMesh,
                orbitGroup: orbitGroup,
                label: label,
                angle: data.angle
            };

            planetObjects.push(planetObj);

            label.addEventListener('click', () => {
                triggerHaptic();
                openModal(data);
                highlightChip(data.word);
            });

            const chip = document.createElement('button');
            chip.className = 'word-chip';
            if (isDennis) chip.classList.add('border-pink-400', 'bg-pink-500/20');
            chip.dataset.word = data.word;
            chip.innerHTML = `<i class="fa-solid ${data.icon || 'fa-heart'} text-xs"></i> <span>${data.word}</span>`;
            
            chip.addEventListener('click', () => {
                triggerHaptic();
                openModal(data);
                highlightChip(data.word);
                focusCameraOnPlanet(planetObj);
            });

            chipsCarousel.appendChild(chip);
        }

        function highlightChip(word) {
            document.querySelectorAll('.word-chip').forEach(c => {
                if (c.dataset.word === word) {
                    c.classList.add('active');
                    c.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    c.classList.remove('active');
                }
            });
        }

        function focusCameraOnPlanet(planetObj) {
            const tempV = new THREE.Vector3();
            planetObj.mesh.getWorldPosition(tempV);

            let startPos = camera.position.clone();
            let targetPos = new THREE.Vector3(tempV.x * 1.2, tempV.y + 12, tempV.z * 1.2 + 20);
            let startTime = performance.now();

            function step(now) {
                let progress = Math.min((now - startTime) / 600, 1);
                let ease = 1 - Math.pow(1 - progress, 3);
                camera.position.lerpVectors(startPos, targetPos, ease);
                controls.target.lerp(tempV, ease);
                controls.update();
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function updateLabels() {
            const tempV = new THREE.Vector3();

            planetObjects.forEach(obj => {
                obj.mesh.getWorldPosition(tempV);
                const distance = camera.position.distanceTo(tempV);
                tempV.project(camera);

                const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;

                if (tempV.z < 1.0) {
                    obj.label.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                    obj.label.style.display = 'flex';
                    obj.label.style.opacity = Math.max(0.3, Math.min(1, (100 - distance) / 70));
                } else {
                    obj.label.style.display = 'none';
                }
            });
        }

        const noteModal = document.getElementById('note-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalIconWrapper = document.getElementById('modal-icon-wrapper');

        function openModal(data) {
            modalTitle.textContent = data.word;
            modalBody.textContent = data.note;
            modalIconWrapper.innerHTML = `<i class="fa-solid ${data.icon || 'fa-sparkles'} text-pink-300"></i>`;
            noteModal.classList.remove('hidden');
        }

        function closeModal() {
            triggerHaptic();
            noteModal.classList.add('hidden');
            document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('active'));
        }

        document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        document.getElementById('modal-action-btn').addEventListener('click', closeModal);

        const addModal = document.getElementById('add-modal');
        const addWordBtn = document.getElementById('add-word-btn');
        const closeAddModalBtn = document.getElementById('close-add-modal-btn');
        const submitWordBtn = document.getElementById('submit-word-btn');

        addWordBtn.addEventListener('click', () => {
            triggerHaptic();
            addModal.classList.remove('hidden');
        });

        closeAddModalBtn.addEventListener('click', () => {
            triggerHaptic();
            addModal.classList.add('hidden');
        });

        submitWordBtn.addEventListener('click', () => {
            triggerHaptic();
            const wordInput = document.getElementById('new-word-input').value.trim();
            const noteInput = document.getElementById('new-note-input').value.trim();

            if (!wordInput) return;

            const maxRadius = planetObjects.length > 0 
                ? Math.max(...planetObjects.map(p => p.data.radius)) + 4.5 
                : 12;

            const newPlanetData = {
                word: wordInput,
                radius: maxRadius,
                speed: Math.max(0.001, 0.007 - planetObjects.length * 0.0004),
                angle: Math.random() * Math.PI * 2,
                tiltX: (Math.random() - 0.5) * 0.3,
                tiltZ: (Math.random() - 0.5) * 0.3,
                note: noteInput || `Dennis, una palabra especial creada especialmente para ti ♥`,
                icon: "fa-heart"
            };

            addPlanetToScene(newPlanetData);

            document.getElementById('new-word-input').value = '';
            document.getElementById('new-note-input').value = '';
            addModal.classList.add('hidden');
        });

        document.getElementById('reset-cam-btn').addEventListener('click', () => {
            triggerHaptic();
            let startPos = camera.position.clone();
            let startTarget = controls.target.clone();
            let isPortrait = window.innerHeight > window.innerWidth;
            let targetPos = new THREE.Vector3(0, 32, isPortrait ? 65 : 55);
            let targetTarget = new THREE.Vector3(0, 0, 0);
            let startTime = performance.now();

            function step(now) {
                let progress = Math.min((now - startTime) / 600, 1);
                let ease = 1 - Math.pow(1 - progress, 3);
                camera.position.lerpVectors(startPos, targetPos, ease);
                controls.target.lerpVectors(startTarget, targetTarget, ease);
                controls.update();
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        });

        function startAudioPlayback() {
            bgAudio.volume = 0.9;
            const playPromise = bgAudio.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isAudioPlaying = true;
                    updateMusicUI(true);
                }).catch(err => {
                    console.log("Local path playback waiting for user selection or fallback:", err);
                    playSynthFallback();
                    isAudioPlaying = true;
                    updateMusicUI(true);
                });
            }
        }

        function playSynthFallback() {
            try {
                if (!synthAudioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    synthAudioCtx = new AudioContext();
                }
                if (synthAudioCtx.state === 'suspended') {
                    synthAudioCtx.resume();
                }

                const freqs = [261.63, 329.63, 392.00, 493.88];
                freqs.forEach(freq => {
                    const osc = synthAudioCtx.createOscillator();
                    const gain = synthAudioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, synthAudioCtx.currentTime);
                    gain.gain.setValueAtTime(0.04, synthAudioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(synthAudioCtx.destination);
                    osc.start();
                });
            } catch(e) {}
        }

        function toggleMusic() {
            triggerHaptic();
            if (isAudioPlaying) {
                bgAudio.pause();
                if (synthAudioCtx) synthAudioCtx.suspend();
                isAudioPlaying = false;
                updateMusicUI(false);
            } else {
                startAudioPlayback();
            }
        }

        function updateMusicUI(playing) {
            const btn = document.getElementById('music-btn');
            const icon = document.getElementById('music-icon');
            if (playing) {
                btn.classList.add('border-pink-400', 'bg-pink-500/40');
                icon.className = 'fa-solid fa-pause text-sm text-pink-300';
            } else {
                btn.classList.remove('border-pink-400', 'bg-pink-500/40');
                icon.className = 'fa-solid fa-music text-sm text-pink-200';
            }
        }

        document.getElementById('music-btn').addEventListener('click', toggleMusic);

        // Instant file input override listener
        const audioFileInput = document.getElementById('audio-file-input');
        const audioFileLabel = document.getElementById('audio-file-label');

        audioFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const objectUrl = URL.createObjectURL(file);
                bgAudio.src = objectUrl;
                bgAudio.load();
                audioFileLabel.textContent = "✓ Canción cargada: " + file.name;
                audioFileLabel.classList.add('text-pink-300', 'font-semibold');
                triggerHaptic();
            }
        });

        // Start button unlock handler
        document.getElementById('start-btn').addEventListener('click', () => {
            triggerHaptic();

            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 700);

            document.getElementById('main-header').classList.remove('opacity-0');
            document.getElementById('floating-controls').classList.remove('opacity-0');
            document.getElementById('bottom-carousel').classList.remove('opacity-0');

            startAudioPlayback();
        });

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (heartSunGroup) {
                const pulse = 1 + Math.sin(elapsedTime * 2.8) * 0.06;
                heartMesh.scale.set(2.7 * pulse, 2.7 * pulse, 2.7 * pulse);

                heartSunGroup.rotation.y = elapsedTime * 0.16;
                glowingAuraMesh.rotation.z = elapsedTime * 0.1;
                heartParticles.rotation.y = -elapsedTime * 0.12;
            }

            planetObjects.forEach(obj => {
                obj.angle += obj.data.speed;
                const x = Math.cos(obj.angle) * obj.data.radius;
                const z = Math.sin(obj.angle) * obj.data.radius;

                obj.mesh.position.set(x, 0, z);
                obj.mesh.rotation.y += 0.02;
            });

            controls.update();
            updateLabels();

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const isPortrait = window.innerHeight > window.innerWidth;
            camera.fov = isPortrait ? 68 : 55;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = function() {
            initScene();
            animate();
        };
    </script>
</body>
</html>
